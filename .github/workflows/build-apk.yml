name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build arm64
    uses: ./.github/workflows/build-abi.yml
    secrets: inherit
    with:
      abi: arm64-v8a
      abi_dir: arm64

  build-armv7:
    name: Build armv7
    # armv7 devices are a small, shrinking slice of users, so this build only
    # runs once a PR is actually merged into master, not on every push/PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    uses: ./.github/workflows/build-abi.yml
    secrets: inherit
    with:
      abi: armeabi-v7a
      abi_dir: arm
