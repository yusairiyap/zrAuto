name: Build APK (single ABI)

on:
  workflow_call:
    inputs:
      abi:
        description: 'Android ABI to build (e.g. arm64-v8a, armeabi-v7a)'
        required: true
        type: string
      abi_dir:
        description: 'Short label used for the dist folder and artifact name (e.g. arm64, arm)'
        required: true
        type: string

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build zrAuto APK (${{ inputs.abi_dir }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read versions from version catalog
        run: |
          ver_file=gradle/libs.versions.toml
          version() { grep -Po "(?<=$1).+" $ver_file |  sed -e 's/[= "]//g'; }
          app_version="$(version appVersionName)-$(git rev-parse --short HEAD)"
          sed -ri "s/appVersionName.+/appVersionName = \"$app_version\"/" $ver_file
          echo "APP_VERSION=$app_version" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=$(version ndkVersion)-$git_hash" >> $GITHUB_ENV

      - name: Export vars
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ID_SFX: ${{ vars.APP_ID_SFX }}
          ARTIFACT_SFX: ${{ vars.ARTIFACT_SFX }}
        run: |
          export_vars() {
            for name in "$@"; do
              local value="${!name}"
              [ -z "$value" ] && continue
              [ "$value" = "none" ] && value=""
              echo "$name=$value" >> "$GITHUB_ENV"
            done
          }
          export_vars APP_NAME APP_ID_SFX ARTIFACT_SFX

      - name: Prepare build identifiers
        env:
          BRANCH_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          [ -v APP_NAME ] && [ -v APP_ID_SFX ] && [ -v ARTIFACT_SFX ] && exit 0

          sanitize_package_segment() {
            tr '[:upper:]' '[:lower:]' <<< "$1" \
              | sed -E 's/[^a-z0-9]+/_/g; s/^_+|_+$//g; s/_+/_/g; s/^([0-9])/x\1/'
          }

          owner="$(sanitize_package_segment "$BRANCH_OWNER")"
          branch="$(sanitize_package_segment "$BRANCH_NAME")"

          [ -v APP_NAME ] || echo "APP_NAME=zrAuto" >> "$GITHUB_ENV"
          [ -v APP_ID_SFX ] || echo "APP_ID_SFX=.${owner}" >> "$GITHUB_ENV"
          [ -v ARTIFACT_SFX ] || echo "ARTIFACT_SFX=-${owner}-${branch}" >> "$GITHUB_ENV"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ${{ runner.os }}-android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore and local.properties
        run: |
          [ -z "${{ secrets.CI_KEYSTORE }}" ] && exit 0
          echo "${{ secrets.CI_KEYSTORE }}" | base64 -d > keystore.jks

          cat > local.properties <<EOF
          storeFile=$(pwd)/keystore.jks
          keyAlias=${{ secrets.CI_ALIAS }}
          keyPassword=${{ secrets.CI_KEY_PWD }}
          storePassword=${{ secrets.CI_KEYSTORE_PWD }}
          EOF

      # The whisper module's CMake build FetchContents (git clones) whisper.cpp and its
      # Vulkan headers on every configure, then compiles them with LTO from scratch --
      # this one native build dominates total CI time (~5-7 min of an ~11 min run).
      # Caching .cxx lets CMake re-use the cloned sources (fetch instead of clone) and
      # ninja skip already-built objects when nothing relevant changed.
      - name: Cache whisper native build (.cxx)
        uses: actions/cache@v4
        with:
          path: modules/whisper/.cxx
          key: whisper-cxx-${{ inputs.abi }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('modules/whisper/src/main/cpp/**') }}
          restore-keys: |
            whisper-cxx-${{ inputs.abi }}-${{ env.ANDROID_NDK_VERSION }}-
            whisper-cxx-${{ inputs.abi }}-

      - name: Build APK
        env:
          NO_GS: true
        run: |
          out=fermata/build/outputs/apk_from_bundle/autoRelease
          mkdir -p dist/${{ inputs.abi_dir }}
          echo "App name: $APP_NAME"
          echo "Package suffix: $APP_ID_SFX"
          ARGS=(--build-cache)
           [ -z "$APP_NAME" ] || ARGS+=("-PAPP_NAME=$APP_NAME")
           [ -z "$APP_ID_SFX" ] || ARGS+=("-PAPP_ID_SFX=$APP_ID_SFX")
           ./gradlew fermata:packageAutoReleaseUniversalApk -PABI=${{ inputs.abi }} "${ARGS[@]}"
          mv $out/*.apk dist/${{ inputs.abi_dir }}/

      - name: Upload ${{ inputs.abi_dir }} APK
        uses: actions/upload-artifact@v4
        with:
          name: zrauto-${{ env.APP_VERSION }}${{ env.ARTIFACT_SFX }}-${{ inputs.abi_dir }}
          path: dist/${{ inputs.abi_dir }}/*.apk
          retention-days: 30
          if-no-files-found: error
